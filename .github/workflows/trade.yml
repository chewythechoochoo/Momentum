name: trade-cycle

on:
  schedule:
    # Every 15 minutes, offset by 7 minutes from the top of the hour.
    # GitHub Actions deprioritises crons that line up with minutes 0/15/30/45
    # (the most contested slots in the runner pool), so the literal */15
    # often gets delivered hourly. 7/22/37/52 sit in a much quieter band.
    # The bot's own min-interval floor (MIN_RUN_INTERVAL_MINUTES) prevents
    # any accidentally faster delivery from creating a tight loop.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trade-cycle
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refuse to run with live-money config
        env:
          ALPACA_PAPER: ${{ vars.ALPACA_PAPER || 'true' }}
          ALPACA_BASE_URL: ${{ vars.ALPACA_BASE_URL }}
        run: |
          if [ "$ALPACA_PAPER" != "true" ]; then
            echo "ALPACA_PAPER must be 'true' — refusing to run."
            exit 2
          fi
          case "$ALPACA_BASE_URL" in
            *"api.alpaca.markets"*|*live*)
              echo "ALPACA_BASE_URL looks like a live endpoint — refusing."
              exit 2;;
          esac

      - name: Run trading cycle
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_PAPER: "true"
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          # Floor is 10 min so legit 15-min cron deliveries never trip the
          # guard. Anything closer than 10 min is treated as a misfire.
          MIN_RUN_INTERVAL_MINUTES: "10"
          TRADING_ENABLED: "true"
          LOG_LEVEL: "INFO"
        run: python -m src.main

      - name: Commit dashboard data
        run: |
          # Attribute auto-refresh commits to the repo owner so the contributor
          # list stays clean (no github-actions[bot] in the sidebar).
          git config user.name  "Chu Pei"
          git config user.email "81550987+chewythechoochoo@users.noreply.github.com"
          git add dashboard/data.json data/state.json
          if git diff --staged --quiet; then
            echo "No dashboard changes to commit."
          else
            git commit -m "chore(dashboard): refresh data [skip ci]"
            git push
          fi

  deploy-pages:
    needs: run
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name != 'pull_request' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (latest commit)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Momentum — paper-trading theme-rotation agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="live">

<header class="topbar">
  <div class="brand">
    <span class="brand-word"><em>Momentum</em></span>
    <span class="brand-by">by trading-news-agent</span>
  </div>
  <nav class="nav" id="nav">
    <a href="./"          class="active">LIVE</a>
    <span class="sep">│</span>
    <a href="themes.html">THEMES</a>
  </nav>
  <div class="topbar-right">
    <a href="https://app.alpaca.markets/paper/dashboard/overview" target="_blank" rel="noopener">PAPER ACCOUNT ↗</a>
    <a href="https://github.com/chewythechoochoo/Momentum" target="_blank" rel="noopener">ABOUT ↗</a>
  </div>
</header>

<div class="meta-strip" id="meta-strip">LOADING…</div>

<div class="news-strip" id="news-strip" hidden>
  <span class="news-label">BREAKING<span class="news-pulse"></span></span>
  <div class="news-marquee" id="news-marquee">
    <div class="news-track" id="news-track" aria-live="off"></div>
  </div>
</div>

<div class="ticker-row" id="ticker-row"></div>

<div class="highlight-band" id="highlight-band"></div>

<main>
  <section class="equity-pane" id="equity">
    <div class="equity-header">
      <h2>Total Account Value <span class="muted" id="equity-meta"></span></h2>
    </div>
    <div class="equity-chart" id="equity-chart"></div>
  </section>

  <aside class="feed-pane" id="feed">
    <div class="tabs" id="tabs">
      <div class="tab active" data-tab="decisions">DECISIONS</div>
      <div class="tab" data-tab="positions">POSITIONS</div>
      <div class="tab" data-tab="executions">EXECUTIONS</div>
      <div class="tab" data-tab="readme">README.TXT</div>
    </div>
    <div class="feed-filter">
      <span>FILTER:</span>
      <select id="filter-action">
        <option value="ALL">ALL ACTIONS</option>
        <option value="BUY">BUY</option>
        <option value="SELL">SELL</option>
        <option value="REDUCE">REDUCE</option>
        <option value="HOLD">HOLD</option>
        <option value="SKIP">SKIP</option>
      </select>
      <span class="feed-count" id="feed-count"></span>
    </div>
    <div class="feed-body" id="feed-body"></div>
  </aside>
</main>

<script src="app.js"></script>
</body>
</html>
